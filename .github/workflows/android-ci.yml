name: Android CI

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
  push:
    branches:
      - main
      - 'release/**'
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: 'true'
  NODE_VERSION: '24'
  JAVA_VERSION: '21'

jobs:
  quality:
    name: Fast quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run checkpoint gate
        run: npm run test:fast

# The browser release matrix and the unsigned Android candidate were removed on
# 2026-08-15: GitHub's software WebGL cannot reliably run the 3D rendering matrix
# (intermittent frame-flush and gesture timeouts), and the signed release build
# plus real-device acceptance already run locally. The web E2E matrix is
# local/device-owned, matching the existing v11 gesture-test precedent.
