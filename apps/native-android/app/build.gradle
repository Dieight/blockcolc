plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android'; id 'org.jetbrains.kotlin.plugin.compose' }
def diagnostics=providers.gradleProperty('nativeDiagnostics').getOrElse('false')=='true'
def largeHeap=providers.gradleProperty('nativeLargeHeap').getOrElse('false')
if(!(largeHeap in ['true','false']))throw new GradleException('nativeLargeHeap must be true or false')
def diagnosticVersion=providers.gradleProperty('nativePreviewVersionCode')
if(diagnosticVersion.isPresent()&&(!diagnostics||!(diagnosticVersion.get()==~ /[1-9][0-9]{0,8}/)))throw new GradleException('nativePreviewVersionCode is a positive diagnostic-only version override')
// An internal benchmark can retain the installed preview's version code so
// its byte-identical original APK can be restored without an uninstall.
def benchmarkVersion=providers.gradleProperty('nativeBenchmarkVersionCode')
if(benchmarkVersion.isPresent()) {
    if(diagnostics||!(benchmarkVersion.get()==~ /[1-9][0-9]{0,8}/))throw new GradleException('Invalid benchmark version override')
    gradle.taskGraph.whenReady { graph ->
        if(!graph.hasTask(':app:recordBenchmarkPreview')||graph.allTasks.any{it.name in ['assembleRelease','assembleDebug','recordPrivatePreview','recordStandardPreview']})
            throw new GradleException('Version override is restricted to recordBenchmarkPreview')
    }
}
android {
    namespace 'com.blockcolc.preview'
    compileSdk 35
    defaultConfig { applicationId 'com.blockcolc.preview'; minSdk 23; targetSdk 35; versionCode(diagnostics?diagnosticVersion.getOrElse('2').toInteger():benchmarkVersion.getOrElse('12').toInteger()); versionName(diagnostics?'0.3-p3-diagnostic':'3.0.0-p3-preview'); testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner' }
    defaultConfig { buildConfigField 'boolean','NATIVE_DIAGNOSTICS',diagnostics.toString() }
    defaultConfig { manifestPlaceholders = [nativeLargeHeap:largeHeap] }
    buildTypes {
        debug { minifyEnabled !diagnostics; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),'user-preview.pro' }
        release { signingConfig signingConfigs.debug; debuggable false; minifyEnabled !diagnostics; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),'user-preview.pro' }
        // Same isolated identity and signing as the user preview, with the
        // production optimizer and runtime flags. Never benchmark Debug as if
        // it were the release application.
        benchmark {
            initWith release
            matchingFallbacks = ['release']
            signingConfig signingConfigs.debug
            debuggable false
        }
    }
    sourceSets.main.java.srcDir diagnostics?'src/diagnostic/kotlin':'src/userPreview/kotlin'
    if(diagnostics)sourceSets.test.java.srcDir 'src/diagnosticTest/kotlin'
    if(diagnostics) { sourceSets.main.res.srcDir 'src/diagnostic/res' }
    buildFeatures { compose true }
    buildFeatures { buildConfig true }
    defaultConfig { buildConfigField 'String','PUBLIC_RELEASE_VERSION',groovy.json.JsonOutput.toJson(new groovy.json.JsonSlurper().parse(rootProject.file('../../version.json')).versionName) }
    compileOptions { coreLibraryDesugaringEnabled true; sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
    if(diagnostics) sourceSets.main.assets.srcDir layout.buildDirectory.dir('generated/world-inputs')
    if(diagnostics) sourceSets.main.assets.srcDir layout.buildDirectory.dir('generated/web-reference')
    if(diagnostics) sourceSets.main.assets.srcDir layout.buildDirectory.dir('generated/p2-fixture')
    sourceSets.main.res.srcDir project(':presentation-core').layout.buildDirectory.dir('generated/native-ui/res')
    aaptOptions { noCompress 'bin','filamat','f32','ogg' }
}

// Instrumentation belongs to the diagnostic variant. Disabling the component
// also keeps ordinary user-package lint from traversing diagnostic test roots.
androidComponents.beforeVariants(androidComponents.selector().all()){variant->
    if(diagnostics && variant.buildType=='benchmark')variant.enable=false
    variant.enableAndroidTest=diagnostics
}

