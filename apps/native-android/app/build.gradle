tasks.register('prepareWorldInputs', Sync) {
    def input = providers.gradleProperty('worldInputs')
    inputs.file(input.map { new File(rootProject.file(it),'manifest.json') })
    from(input.map { rootProject.file(it) }) { include '*.bin','*.world.json','resource-pack.json','images/*.png','images/*.f32' }
    into layout.buildDirectory.dir('generated/world-inputs')
    doFirst {
        if(!input.isPresent())throw new GradleException('Pass -PworldInputs=<frozen P1 input directory>; no placeholder world is used.')
        def manifest=new File(rootProject.file(input.get()),'manifest.json')
        if(!manifest.isFile())throw new GradleException('P1 input export is unfinished: manifest.json is missing.')
        def source=new groovy.json.JsonSlurper().parse(manifest)
        if(source.inventoryOnly==true)throw new GradleException('Source inventory is not a complete frozen native input.')
        def fixtures=source.reports*.name
        if(source.errors!=[] || !(source.producerFingerprint instanceof String) || !(source.producerFingerprint==~ /[a-f0-9]{64}/) || !(fixtures in [['ocean','coast'],['ocean','coast','valley','floating']]))
            throw new GradleException('P1 input export did not pass its final source/fixture checks.')
        if(source.assets=='mc263'&&!new File(rootProject.file(input.get()),'resource-pack.json').isFile())throw new GradleException('MC source reference is missing its normalized resource pack; do not substitute original assets.')
        for(name in fixtures)for(world in [name,name+'-update'])for(ext in ['bin','world.json'])if(!new File(rootProject.file(input.get()),world+'.'+ext).isFile())throw new GradleException('Missing P1 input: '+world+'.'+ext)
    }
}
if(diagnostics) tasks.named('preBuild').configure { dependsOn 'prepareWorldInputs' }
tasks.named('preBuild').configure { dependsOn ':presentation-core:exportNativeUiAssets' }
tasks.register('buildSourceReference',Exec) {
    workingDir rootProject.projectDir
    commandLine 'node','../../node_modules/vite/bin/vite.js','build','--config','tools/reference-vite.config.ts'
    inputs.files(fileTree('../../../packages/voxel/src'),fileTree('../tools'),fileTree('../../../spikes/world-closeup') {include 'vite.config.ts'})
    outputs.dir layout.buildDirectory.dir('generated/web-reference')
}
if(diagnostics) tasks.named('preBuild').configure { dependsOn 'buildSourceReference' }
tasks.register('prepareP2Fixture',Exec) {
    def input=providers.gradleProperty('worldInputs')
    workingDir rootProject.projectDir
    doFirst { if(!input.isPresent())throw new GradleException('worldInputs required for the explicit P2 synthetic fixture') }
    commandLine 'node','tools/export-p2-fixture.mjs',input.getOrElse('missing'),layout.buildDirectory.dir('generated/p2-fixture').get().asFile.absolutePath
    inputs.file input.map { new File(rootProject.file(it),'manifest.json') }
    inputs.file '../tools/export-p2-fixture.mjs'
    inputs.files fileTree('../../../packages/domain/src') { include '**/*.ts' }
    outputs.dir layout.buildDirectory.dir('generated/p2-fixture')
}
if(diagnostics) tasks.named('preBuild').configure { dependsOn 'prepareP2Fixture' }
tasks.register('prepareConstructionInputs',Sync) {
    def input=providers.gradleProperty('constructionInputs')
    if(input.isPresent()) {
        from(input.map { rootProject.file(it) }) {
            include 'p2-construction.json','construction/*.p2pack','images/*.png','images/*.f32'
            eachFile { details ->
                if(details.relativePath.segments[0]=='images') {
                    def base=new File(rootProject.file(providers.gradleProperty('worldInputs').get()),details.relativePath.pathString)
                    if(base.isFile()) {
                        def digest={ f -> java.security.MessageDigest.getInstance('SHA-256').digest(f.bytes).encodeHex().toString() }
                        if(digest(base)!=digest(details.file))throw new GradleException('Construction texture conflicts with world asset: '+details.path)
                        details.exclude()
                    }
                }
            }
        }
        inputs.file input.map { new File(rootProject.file(it),'p2-construction.json') }
    }
    into layout.buildDirectory.dir('generated/construction-inputs')
    doFirst {
        if(input.isPresent()) {
            def index=new groovy.json.JsonSlurper().parse(new File(rootProject.file(input.get()),'p2-construction.json'))
            if(index.completed!=true||index.schema!=1)throw new GradleException('Construction export is incomplete')
        }
    }
}
