// AndroidTest packaging alone can leave the target APK from a previous source
// revision. Device instrumentation uses only a recorded, current pair.
tasks.register('assembleP3DebugPair',Exec){
    dependsOn 'assembleDebug','assembleDebugAndroidTest'
    workingDir rootProject.projectDir
    commandLine 'node','tools/preview-apk-pair.mjs','--record'
}

dependencies { implementation project(':export-core') }

if(diagnostics){
    def combined=layout.buildDirectory.file('generated/diagnostic-manifest/AndroidManifest.xml')
    android.sourceSets.main.manifest.srcFile combined
    tasks.register('prepareDiagnosticManifest'){
        inputs.files 'src/main/AndroidManifest.xml','src/diagnostic/AndroidManifest.xml'
        outputs.file combined
        doLast{
            def main=file('src/main/AndroidManifest.xml').getText('UTF-8')
            def entries=file('src/diagnostic/AndroidManifest.xml').getText('UTF-8').split('<application>')[1].split('</application>')[0]
            def out=combined.get().asFile;out.parentFile.mkdirs();out.setText(main.replace('</application>',entries+'\n</application>'),'UTF-8')
        }
    }
    tasks.named('preBuild').configure {dependsOn 'prepareDiagnosticManifest'}
}
def identity=layout.buildDirectory.file('generated/native-build/native-build.json')
tasks.register('prepareNativeBuildIdentity'){
    inputs.property 'diagnostics',diagnostics
    inputs.property 'privateRelay',false
    inputs.property 'largeHeap',largeHeap
    outputs.file identity
    doLast{def out=identity.get().asFile;out.parentFile.mkdirs();out.text=groovy.json.JsonOutput.toJson([schema:1,mode:diagnostics?'diagnostic':'user-preview',privateRelay:false,accountBased:true,cloudProtocol:1,applicationId:'com.blockcolc.preview',largeHeap:largeHeap=='true'])}
}
android.sourceSets.main.assets.srcDir layout.buildDirectory.dir('generated/native-build')
tasks.named('preBuild').configure {dependsOn 'prepareNativeBuildIdentity'}
tasks.register('requireNativeDiagnostics'){doLast{if(!diagnostics)throw new GradleException('Instrumentation requires -PnativeDiagnostics=true; user preview has no diagnostic APIs/assets')}}
