plugins { id 'com.android.library'; id 'org.jetbrains.kotlin.android' }
android {
    namespace 'com.blockcolc.storage.android'
    compileSdk 35
    defaultConfig { minSdk 23; testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner' }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }
    kotlinOptions { jvmTarget = '17' }
}
dependencies {
    api project(':state-store')
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.3'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
