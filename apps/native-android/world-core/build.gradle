tasks.register('auditFrozenInputs',JavaExec) {
    dependsOn 'testClasses'
    classpath=sourceSets.test.runtimeClasspath
    mainClass='com.blockcolc.world.FrozenInputAudit'
    maxHeapSize='2g'
    doFirst {
        def input=providers.gradleProperty('p1AuditInput')
        def report=providers.gradleProperty('p1AuditReport')
        if(!input.isPresent()||!report.isPresent())throw new GradleException('Pass p1AuditInput and a new p1AuditReport path.')
        args rootProject.file(input.get()).absolutePath,rootProject.file(report.get()).absolutePath
    }
}

