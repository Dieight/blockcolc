tasks.register('exportSceneryDeviceOracle'){
    dependsOn 'exportSceneryOracle'
    def input=layout.buildDirectory.file('generated/scenery-oracle/scenery-oracle.json')
    def output=layout.buildDirectory.file('generated/scenery-device-oracle/scenery-device-oracle.json')
    inputs.file input
    outputs.file output
    doLast {
        def source=input.get().asFile
        def oracle=new groovy.json.JsonSlurper().parse(source)
        def cases=oracle.worlds.findAll {it.name.contains(':variant-0-count-1:world-default:auto:null')}
        if(cases.size()!=4)throw new GradleException('Four formal scenery environments are required')
        def result=[schema:1,producerSha:java.security.MessageDigest.getInstance('SHA-256').digest(source.bytes).encodeHex().toString(),cases:cases]
        def target=output.get().asFile;target.parentFile.mkdirs();target.text=groovy.json.JsonOutput.toJson(result)
    }
}

