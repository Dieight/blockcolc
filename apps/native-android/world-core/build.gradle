tasks.register('exportTerrainGeneratorIdentity'){
    def sources=fileTree('src/main/kotlin/com/blockcolc/world/generation'){include '**/*.kt'}
    def output=layout.buildDirectory.file('generated/generator-identity/native-world-generator-id.txt')
    inputs.files sources
    inputs.files 'build.gradle','../build.gradle'
    outputs.file output
    doLast {
        def digest=java.security.MessageDigest.getInstance('SHA-256')
        def files=(sources.files+[file('build.gradle'),file('../build.gradle')]).sort{a,b->project.relativePath(a).replace('\\','/')<=>project.relativePath(b).replace('\\','/')}
        for(source in files){digest.update(project.relativePath(source).replace('\\','/').getBytes('UTF-8'));digest.update((byte)0);digest.update(source.bytes);digest.update((byte)0)}
        def target=output.get().asFile;target.parentFile.mkdirs();target.text=digest.digest().encodeHex().toString()
    }
}
sourceSets.main.resources.srcDir layout.buildDirectory.dir('generated/generator-identity')
tasks.named('processResources').configure {dependsOn 'exportTerrainGeneratorIdentity'}

